name: Android build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install required Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"'
      - run: npm ci
      - run: npm run mobile:preview
      - name: Compile Android test package
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Confirm preview cannot become a release
        working-directory: android
        run: |
          if ./gradlew verifyMobileRelease --no-daemon > release-guard.log 2>&1; then
            cat release-guard.log
            exit 1
          fi
          grep -q 'Preview/unconfigured builds cannot be released' release-guard.log
      - name: Package the live public backend for native tests
        run: node scripts/prepare-mobile-live-test.mjs
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test the native Android shell
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: cd android && (./gradlew :app:connectedDebugAndroidTest --no-daemon || { mkdir -p app/build/reports/androidTests; adb logcat -d > app/build/reports/androidTests/native-logcat.txt; exit 1; })
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-tests
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore
