name: Android build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install required Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"'
      - run: npm ci
      - run: npm run mobile:preview
      - name: Compile Android test package
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Confirm preview cannot become a release
        working-directory: android
        run: |
          if ./gradlew verifyMobileRelease --no-daemon > release-guard.log 2>&1; then
            cat release-guard.log
            exit 1
          fi
          grep -q 'Preview/unconfigured builds cannot be released' release-guard.log
